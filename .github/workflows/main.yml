name: ASP.NET CI/CD to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find solution file
        id: findsln
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1

          if (-not $sln) {
            Write-Error "No .sln file found in repository."
            exit 1
          }

          Write-Host "Found solution: $($sln.FullName)"
          echo "SLN_PATH=$($sln.FullName)" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore "${{ env.SLN_PATH }}"

      - name: Build Application
        shell: powershell
        run: |
          msbuild "${{ env.SLN_PATH }}" `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      - name: Publish Application
        shell: powershell
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "No .csproj file found in repository."
            exit 1
          }

          Write-Host "Publishing project: $($project.FullName)"

          msbuild "$($project.FullName)" `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$env:GITHUB_WORKSPACE\publish_output"

      - name: Verify Publish Output
        shell: powershell
        run: |
          Write-Host "Listing publish_output folder..."

          if (!(Test-Path "$env:GITHUB_WORKSPACE\publish_output")) {
            Write-Error "publish_output folder does not exist."
            exit 1
          }

          Get-ChildItem "$env:GITHUB_WORKSPACE\publish_output" -Recurse

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-publish
          path: publish_output
          retention-days: 2

  deploy:
    needs: build

    runs-on:
      - self-hosted
      - Windows

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-publish
          path: C:\deploy\webapi-temp

      - name: Stop App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "aspwebapi5pool"

      - name: Deploy Application to IIS
        shell: powershell
        run: |
          $source = "C:\deploy\webapi-temp"
          $destination = "C:\inetpub\wwwroot\aspwebapi5"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Write-Host "Removing old files..."

          Get-ChildItem $destination -Recurse -Force |
              Remove-Item -Recurse -Force

          Write-Host "Copying new build..."

          Copy-Item "$source\*" `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host "Deployment completed."

      - name: Start App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "aspwebapi5pool"

      - name: Cleanup Temporary Files
        shell: powershell
        run: |
          Remove-Item "C:\deploy\webapi-temp" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
