name: ASP.NET Web App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore

      - name: Build Solution
        run: msbuild /p:Configuration=Release

      - name: Publish Web App
        run: |
          msbuild "asnetwebapi5(git actions).csproj" `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="${{ github.workspace }}\publish_output"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish_output
          if-no-files-found: error


  # =========================
  # DEPLOY TO IIS
  # =========================
  deploy:
    needs: build

    runs-on:
      - self-hosted
      - Windows

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: C:\deploy\webapp

      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "aspwebapi5pool"

      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "C:\deploy\webapp"
          $destination = "C:\inetpub\wwwroot\aspwebapi5"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Remove-Item "$destination\*" -Recurse -Force

          Copy-Item "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force

      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "aspwebapi5pool"

      - name: Cleanup
        shell: powershell
        run: |
          Remove-Item "C:\deploy\webapp" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
