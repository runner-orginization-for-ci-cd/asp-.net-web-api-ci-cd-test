name: ASP.NET Web API CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    env:
      BUILD_CONFIGURATION: Release

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Install NuGet
      # -----------------------------
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2


      # -----------------------------
      # Setup MSBuild
      # -----------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # -----------------------------
      # Find Solution
      # -----------------------------
      - name: Find Solution
        shell: powershell
        run: |

          $sln = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter *.sln `
            -Recurse |
            Select-Object -First 1

          if (-not $sln) {
              Write-Error "No .sln file found."
              exit 1
          }

          Write-Host "Solution:"
          Write-Host $sln.FullName

          "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV


      # -----------------------------
      # Restore NuGet Packages
      # -----------------------------
      - name: Restore NuGet Packages
        shell: powershell
        run: |

          nuget restore "$env:SOLUTION"


      # -----------------------------
      # Build + Publish
      # -----------------------------
      - name: Publish Web API
        shell: powershell
        run: |

          $publishPath = "$env:GITHUB_WORKSPACE\publish_output"

          if (Test-Path $publishPath) {
              Remove-Item $publishPath -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishPath `
            -Force | Out-Null

          Write-Host "Publishing to:"
          Write-Host $publishPath

          msbuild "$env:SOLUTION" `
            /m `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform="Any CPU" `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            /p:DeleteExistingFiles=true `
            /p:publishUrl="$publishPath"


      # -----------------------------
      # Verify Published Files
      # -----------------------------
      - name: Verify Published Files
        shell: powershell
        run: |

          $path = "$env:GITHUB_WORKSPACE\publish_output"

          Write-Host "======================================"
          Write-Host "Publish Path: $path"
          Write-Host "======================================"

          if (!(Test-Path $path)) {
              Write-Error "PUBLISH FAILED: Folder was not created."
              exit 1
          }

          $files = Get-ChildItem `
            $path `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
              Write-Error "PUBLISH FAILED: No files were published."
              exit 1
          }

          Write-Host "Published files: $($files.Count)"

          Get-ChildItem `
            $path `
            -Recurse


      # -----------------------------
      # Upload Artifact
      # -----------------------------
      - name: Upload Web API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebApi
          path: ${{ github.workspace }}/publish_output
          if-no-files-found: error
          retention-days: 2
