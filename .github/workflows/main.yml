name: ASP.NET CI/CD to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find solution file
        id: findsln
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1

          if (-not $sln) {
            Write-Error "No .sln file found in repository."
            exit 1
          }

          Write-Host "Found solution: $($sln.FullName)"
          echo "SLN_PATH=$($sln.FullName)" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SLN_PATH }}"

      - name: Build Application
        run: msbuild "${{ env.SLN_PATH }}" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify Publish Output
        run: |
          echo "Listing publish_output folder..."
          ls -R publish_output

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-publish
          path: publish_output
          retention-days: 2

  deploy:
    needs: build
    runs-on:
      - self-hosted
      - Windows

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-publish
          path: C:\deploy\webapi-temp

      - name: Stop App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "aspwebapi5pool"

      - name: Deploy Application to IIS
        shell: powershell
        run: |
          $source = "C:\deploy\webapi-temp"
          $destination = "C:\inetpub\wwwroot\aspwebapi5"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Remove old files
          Get-ChildItem $destination -Recurse -Force | Remove-Item -Recurse -Force

          # Copy new build
          Copy-Item "$source\*" `
              -Destination $destination `
              -Recurse `
              -Force

      - name: Start App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "aspwebapi5pool"

      - name: Cleanup Temporary Files
        shell: powershell
        run: |
          Remove-Item "C:\deploy\webapi-temp" -Recurse -Force -ErrorAction SilentlyContinue
